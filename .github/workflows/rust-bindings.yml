name: Rust bindings

on:
  push:
    branches: [master, rust-safe-bindings]
    paths:
      - 'bindings/rust/**'
      - '.github/workflows/rust-bindings.yml'
  pull_request:
    paths:
      - 'bindings/rust/**'
      - '.github/workflows/rust-bindings.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-safe-bindings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting
        working-directory: .
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bindings/rust
            git commit -m 'rust: format bindings'
            git push origin HEAD:rust-safe-bindings
          fi
      - name: Check
        run: cargo check --workspace --all-targets --features no-link
      - name: Test safe layer
        run: cargo test -p nccl --features no-link --lib
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features no-link -- -D warnings
