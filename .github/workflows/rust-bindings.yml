name: Rust bindings

on:
  push:
    branches: [master, rust-safe-bindings]
    paths:
      - 'bindings/rust/**'
      - '.github/workflows/rust-bindings.yml'
  pull_request:
    paths:
      - 'bindings/rust/**'
      - '.github/workflows/rust-bindings.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --features no-link
      - name: Test safe layer
        run: cargo test -p nccl --features no-link --lib
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features no-link -- -D warnings
